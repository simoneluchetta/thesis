[project]
name = "arena-reconstruction"
version = "0.1.0"
description = "Camera calibration, athletes in 2D and 3D, and the viewer exporters of the arena reconstruction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=0.9",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "open3d>=0.17",
    "pycolmap>=0.6",
    "torchreid>=0.2.5",
    # torchreid imports torch's TensorBoard writer and gdown at import time without declaring them
    "tensorboard>=2.14",
    "gdown>=6.1.0",
    "smplx>=0.1.28",
    # reads the shirt numbers; the roster needs them
    "easyocr>=1.7",
]

[dependency-groups]
dev = ["ruff>=0.9"]

[tool.uv]
# This is a folder of scripts, not a library: nothing gets built or installed as a package.
package = false
# easyocr asks for the headless build of OpenCV, which would fight with opencv-python for the
# same `cv2` module. The project already ships cv2, so the headless build is switched off.
override-dependencies = ["opencv-python-headless ; sys_platform == 'never'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable name (common in math-heavy code)
    "B008",   # function call in default arg (used by nn.Module)
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
known-first-party = ["camera_frames", "_floor_homography_sanity", "people"]
